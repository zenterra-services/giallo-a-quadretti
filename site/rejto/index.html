<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rejtő a Quadretti</title>
<meta name="description" content="Rejtő Jenő világában játszódó logikai rejtélyek: öt nyelven, magyar segédlettel.">
<meta name="theme-color" content="#D9A441">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&amp;family=Bitter:ital,wght@0,400;0,600;1,400&amp;family=Special+Elite&amp;family=Caveat:wght@400;700&amp;display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*{-webkit-tap-highlight-color:transparent}
/* Layout: a riso-printed detective zine on graph paper — die-cut suspect stickers left, blueprint floor plan right */
html,body{background:var(--paper);color:var(--ink)}
body{font:16px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg{display:block}
mark{background:linear-gradient(transparent 38%,var(--yellow) 38%,var(--yellow) 88%,transparent 88%);color:inherit;padding:0 .12em;border-radius:2px;font-weight:600}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) mark{background:var(--yellow);color:var(--on-yellow)}}
:root[data-theme="dark"] mark{background:var(--yellow);color:var(--on-yellow)}
.hu{color:var(--hu);font-size:.9em;margin:0}
.hu::before{content:"HU";font:700 .68em var(--type);letter-spacing:.08em;border:1.5px solid currentColor;border-radius:4px;padding:0 4px;margin-right:6px;vertical-align:1px}
.typ{font-family:var(--type);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;border:none;background:none;padding:0;text-align:left}
.mark{width:46px;height:46px;flex:none;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--pink);display:grid;grid-template-columns:repeat(3,1fr);padding:4px;gap:2px;transform:rotate(-4deg)}
.mark i{border-radius:2px;background:var(--on-yellow);opacity:.18}.mark i.v{background:var(--red);opacity:1}
.brand h1{font-size:1.45rem;line-height:.95}
.brand small{display:block;font-family:var(--type);font-size:.72rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.pill{border:2.5px solid var(--ink);background:var(--card);border-radius:999px;padding:5px 14px;font:700 .85rem var(--type);letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--card)}
.btn{border:3px solid var(--ink);background:var(--yellow);color:var(--on-yellow);border-radius:12px;padding:9px 18px;font-family:var(--display);font-size:1.05rem;box-shadow:4px 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.92rem;box-shadow:3px 3px 0 var(--shadow)}
.say{border:none;background:none;padding:3px;border-radius:6px;flex:none;color:var(--blue);display:inline-grid;place-items:center;vertical-align:middle}
.say:hover{background:var(--grid)}
.say svg{width:18px;height:18px}

/* hub hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;margin-bottom:28px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:clamp(2.6rem,8vw,5rem);line-height:.92}
.hero h2 .hl{background:var(--yellow);color:var(--on-yellow);padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone;display:inline-block;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--pink)}
.hero p{max-width:52ch;margin:.8em 0 0;font-size:1.05rem}
.hero .actions{margin-top:18px}
.collage{position:relative;aspect-ratio:1.15;max-width:100%}
.collage .st{position:absolute;width:30%;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.18))}
.collage .pg{position:absolute;width:34%;right:2%;bottom:0}
.bubble{position:absolute;left:4%;bottom:6%;max-width:58%;background:var(--card);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:8px 12px;font:1.15rem/1.2 var(--hand);box-shadow:3px 3px 0 var(--shadow)}
.tape{position:absolute;height:20px;width:74px;background:repeating-linear-gradient(-45deg,var(--tape) 0 6px,transparent 6px 10px),var(--tape);opacity:.9}

/* cases */
.section-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:30px 0 14px}
.section-h h2{font-size:1.6rem}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.case{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:18px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:5px 5px 0 var(--shadow);transition:transform .1s}
.case:hover{transform:rotate(-.6deg) translateY(-2px)}
.case .tape{top:-11px;left:22px;transform:rotate(-4deg)}
.case h3{font-size:1.35rem;line-height:1.05}
.case .flav{font-size:.95rem;color:var(--muted)}
.heads{display:flex;margin-top:2px}
.heads span{width:38px;height:38px;margin-right:-8px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.lvl{display:inline-flex;gap:3px}.lvl b{width:12px;height:12px;border:2px solid var(--ink);border-radius:3px;transform:rotate(45deg) scale(.8)}.lvl b.on{background:var(--pink)}
.case .stampwrap{position:absolute;right:8px;top:30%;width:120px;pointer-events:none;opacity:.92}
.case .best{font-family:var(--type);font-size:.78rem;color:var(--ok);font-weight:700}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.rule{background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rule .ri{width:44px;height:44px}
.rule p{margin:0}
.objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:14px}
.objbox{background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px}
.objbox h4{margin:0 0 8px;font:700 .82rem var(--type);letter-spacing:.08em;text-transform:uppercase}
.objbox.yes h4{color:var(--ok)}.objbox.no h4{color:var(--red)}
.ogrid{display:flex;flex-wrap:wrap;gap:10px}
.oi{display:flex;flex-direction:column;align-items:center;width:64px;font-size:.82rem;text-align:center;gap:2px}
.oi .ic{width:44px;height:44px}
.oi small{color:var(--hu);font-size:.72rem;line-height:1.1}

/* case view */
.back{border:none;background:none;font:700 .85rem var(--type);letter-spacing:.06em;text-transform:uppercase;padding:4px 0;color:var(--muted)}
.casehead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;margin:6px 0 18px}
.casehead h2{font-size:clamp(1.9rem,5vw,3rem);line-height:.95;margin-top:4px}
.casehead .flav{margin:.5em 0 0;font-size:1.05rem}
.timer{font:700 1.3rem var(--type);font-variant-numeric:tabular-nums;background:var(--card);border:2.5px solid var(--ink);border-radius:10px;padding:4px 12px;box-shadow:3px 3px 0 var(--shadow)}
.tip{display:flex;gap:10px;align-items:flex-end;margin:0 0 18px}
.tip .pg{width:64px;flex:none}
.tip .tb{background:var(--card);border:2.5px solid var(--ink);border-radius:16px 16px 16px 4px;padding:8px 12px;box-shadow:3px 3px 0 var(--shadow);min-width:0;flex:1;max-width:620px}
.tip .tb p{margin:0}
.tip .tb .say-it{font:1.2rem/1.25 var(--hand)}
.tip .more{border:none;background:none;font:700 .75rem var(--type);color:var(--blue);text-transform:uppercase;letter-spacing:.06em;padding:4px 0 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:26px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.boardcol{order:-1}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.card{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px 12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;min-width:0;box-shadow:3px 3px 0 var(--shadow)}
.card .pic{grid-row:span 3;width:64px;margin-top:-18px}
.card .nm{display:flex;align-items:center;gap:6px;min-width:0}
.card .nm b{font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.05;overflow-wrap:anywhere;flex:1;min-width:0}
.card.sel{outline:4px solid var(--yellow);outline-offset:-1px}
.card.victim{background:color-mix(in srgb,var(--red) 10%,var(--card))}
.card .vtag{position:absolute;right:-6px;top:-10px;background:var(--red);color:#fff;font:700 .7rem var(--type);letter-spacing:.1em;padding:3px 10px;transform:rotate(4deg)}
.clue{margin:0;display:flex;gap:4px;align-items:flex-start}
.clue span{flex:1;min-width:0}
.hubtn{border:1.5px solid var(--hu);background:none;border-radius:5px;font:700 .66rem var(--type);padding:1px 5px;color:var(--hu);flex:none}
.hubtn[aria-pressed="true"]{background:var(--hu);color:var(--card)}
.placed{font:700 .74rem var(--type);color:var(--ok);letter-spacing:.04em}

.boardcol{position:sticky;top:max(8px,env(safe-area-inset-top,0px))}
@media (max-width:860px){.boardcol{position:static}}
.clip{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:14px;box-shadow:6px 6px 0 var(--shadow)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tool{border:2.5px solid var(--ink);background:var(--card);border-radius:999px;padding:2px 10px 2px 2px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem}
.tool .hd{width:28px;height:28px}
.tool[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow)}
.tool.done{opacity:.5}
.tool.xmark{padding:2px 12px;font-family:var(--type)}
.toolhint{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.toolhint.kbd{font-size:.74rem;margin-top:-6px;opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow)}
.modal:focus{outline:none}
.boardwrap{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:4px}
.colnums,.rownums{display:grid;font:700 .78rem var(--type);color:var(--muted);text-align:center}
.rownums{align-items:center;padding-right:3px}
.board{display:grid;border:4px solid var(--wall);border-radius:4px;aspect-ratio:1;max-width:100%;touch-action:manipulation;position:relative;background:var(--wall);gap:0}
.cell{position:relative;border:0;padding:0;min-width:0;min-height:0;display:grid;place-items:center;overflow:visible}
.cell::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.10) 1px,transparent 1.4px);background-size:7px 7px;pointer-events:none}
.cell::after{content:"";position:absolute;inset:0;box-shadow:var(--wst,0 0 0 transparent),var(--wsl,0 0 0 transparent),inset 0 0 0 .5px rgba(29,29,36,.22);pointer-events:none}
.cell.wt{--wst:inset 0 7px 0 -1px rgba(0,0,0,.16)}
.cell.wl{--wsl:inset 7px 0 0 -1px rgba(0,0,0,.16)}
.cell .ob{position:absolute;inset:8%;pointer-events:none}
.cell .ob svg{width:100%;height:100%}
.cell.blk{cursor:not-allowed}
.cell .xm{position:relative;font:clamp(1.2rem,5vw,2rem)/1 var(--hand);color:var(--red);z-index:1}
.cell .pc{position:relative;width:84%;z-index:2;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.28))}
.cell.bad .pc{animation:none;outline:3px dashed var(--red);outline-offset:1px;border-radius:50%}
.cell .lab{position:absolute;left:2px;bottom:2px;z-index:3;background:var(--card);color:var(--ink);font:700 clamp(.42rem,1.6vw,.62rem)/1.1 var(--type);letter-spacing:.04em;text-transform:uppercase;padding:1px 4px;border:1.5px solid var(--wall);transform:rotate(-3deg);white-space:nowrap;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:2px 8px 2px 4px;font-size:.82rem;font-weight:600}
.sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.msg{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card);border:2.5px solid var(--ink);display:grid;gap:4px}
.msg.good{border-color:var(--ok)}.msg.bad{border-color:var(--red)}
.msg p{margin:0}
.slip{margin-top:14px;background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:12px 14px;box-shadow:4px 4px 0 var(--shadow)}
.slip h3{font-size:1.35rem}
.slip .line{border-bottom:2px dashed var(--muted);height:4px;margin:6px 0 12px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}
.gw{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:center;min-width:0}
.gw .ic{width:30px;height:30px;flex:none}
.gw div{flex:1;min-width:0}
.gw b{display:block;line-height:1.15}
.gw .hu{font-size:.8rem}
.gw .hu::before{display:none}

.modal{position:fixed;inset:0;background:rgba(15,15,22,.6);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--card);border:3px solid var(--ink);border-radius:18px;max-width:420px;width:100%;padding:22px;text-align:center;box-sizing:border-box;box-shadow:8px 8px 0 var(--pink)}
.modal .who{width:140px;margin:0 auto -6px;display:block}
.modal .stp{width:230px;margin:0 auto 8px;display:block}
.modal .who svg,.modal .stp svg,.case .stampwrap svg{width:100%;height:auto}
.modal h3{font-size:1.6rem}
.modal p{margin:.4em 0}
@media (prefers-reduced-motion:no-preference){
  .modal .stp{animation:thump .5s cubic-bezier(.2,1.6,.4,1) .15s both}
  @keyframes thump{from{transform:scale(2.4);opacity:0}}
  .collage .st{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{from{transform:scale(.6) rotate(0deg)}}
}
footer{margin-top:34px;color:var(--muted);font-size:.85rem}

/* ---- languages, co-op, phone ---- */
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs button{border:2.5px solid var(--ink);background:var(--card);border-radius:999px;padding:5px 12px;font:700 .85rem var(--body);min-height:40px}
.langs button[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow);box-shadow:3px 3px 0 var(--shadow)}
.coopbox{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:16px;box-shadow:6px 6px 0 var(--shadow);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:760px){.coopbox{grid-template-columns:minmax(0,1fr)}}
.coopbox h3{font-size:1.5rem}
.coopbox p{margin:.4em 0 0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font:700 .75rem var(--type);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{font:600 1.05rem var(--body);padding:10px 12px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);min-height:44px;box-sizing:border-box;width:100%}
.field select{font:600 1.05rem var(--body);padding:10px 12px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);min-height:44px;box-sizing:border-box;width:100%}
.top .style-link{text-decoration:none}
.field input.code{font:700 1.3rem var(--type);letter-spacing:.3em;text-transform:uppercase}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row2 .field{flex:1;min-width:120px;margin:0}
.lobby{display:grid;gap:18px}
.bigcode{font:700 clamp(2.4rem,9vw,4rem)/1 var(--type);letter-spacing:.2em;background:var(--yellow);color:var(--on-yellow);display:inline-block;padding:6px 14px;border:3px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--pink);transform:rotate(-1.5deg)}
.coderow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.players{display:flex;flex-wrap:wrap;gap:10px}
.player{display:flex;align-items:center;gap:8px;background:var(--card);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700}
.player .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 1rem var(--display);color:var(--on-yellow);border:2.5px solid var(--ink)}
.player small{font:700 .7rem var(--type);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.teambar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.teambar .typ{margin-right:4px}
.card.locked{background:repeating-linear-gradient(-45deg,var(--card) 0 10px,var(--paper) 10px 20px)}
.card.locked .clue{color:var(--muted);font-style:italic}
.lockic{width:18px;height:18px;flex:none;color:var(--muted);display:inline-block}.lockic svg{width:100%;height:100%}
.sharebtn{justify-self:start;border:2px solid var(--ink);background:var(--yellow);color:var(--on-yellow);border-radius:999px;font:700 .78rem var(--type);letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;min-height:32px;margin-top:4px}
.sharedtag{font:700 .7rem var(--type);color:var(--blue);letter-spacing:.04em;text-transform:uppercase}
.mine{font:700 .7rem var(--type);color:var(--ok);letter-spacing:.04em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:4px 4px 0 var(--pink);max-width:min(92vw,480px)}
details.drawer{background:var(--card);border:2.5px solid var(--ink);border-radius:12px;margin-top:10px}
details.drawer summary{cursor:pointer;padding:10px 14px;font-family:var(--display);font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.drawer summary::after{content:"+";font-family:var(--type);font-weight:700}
details.drawer[open] summary::after{content:"–"}
details.drawer .inner{padding:0 12px 12px}

/* ---- review notebook ---- */
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.reviewchip{text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:3px 3px 0 var(--shadow)}
.reviewchip:hover{transform:translate(-1px,-1px)}
.reviewchip b{font-family:var(--display);font-weight:400;font-size:1.05rem;line-height:1.1}
.reviewchip small{font:700 .72rem var(--type);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
footer .sibling{color:inherit;text-decoration:underline;text-underline-offset:2px;font-weight:700}
footer .sibling:hover{color:var(--red)}
.modal.review .box{max-width:780px;max-height:90vh;overflow:auto;text-align:left;padding:22px 24px;position:relative}
.xclose{position:absolute;right:10px;top:8px;border:none;background:none;font:700 1.2rem var(--body);padding:6px 10px;border-radius:8px;color:var(--muted)}
.xclose:hover{background:var(--grid)}
.revhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-right:24px}
.revhead h3{font-size:1.6rem}
.hu-toggle{font-size:.75rem;padding:4px 10px;flex:none}
.revsolved{margin:.4em 0 0;font:700 .9rem var(--type);color:var(--ok)}
.reviewlead{margin:.4em 0 0;color:var(--muted)}
.modal.review h4{font:700 .8rem var(--type);letter-spacing:.08em;text-transform:uppercase;margin:20px 0 8px;color:var(--muted)}
.revlist{display:grid;gap:10px}
.revperson{display:grid;grid-template-columns:56px 1fr;gap:10px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;align-items:start}
.revperson.victim{background:color-mix(in srgb,var(--red) 9%,var(--card))}
.revperson .hd{width:52px;margin-top:-10px}
.revbody b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.revclue{margin-top:4px;border-top:1px dashed var(--grid);padding-top:4px}
.revclue .clue{font-size:.95rem}
.revclue .hu{font-size:.82rem}
@media (max-width:520px){.revperson{grid-template-columns:44px 1fr}.revperson .hd{width:42px}.revhead h3{font-size:1.3rem}}

/* phone game screen */
.ph .casehead{margin:2px 0 10px;gap:10px}
.ph .casehead h2{font-size:1.6rem}
.ph .casehead .flav{font-size:.95rem}
.ph .clip{padding:10px;border-radius:14px;box-shadow:4px 4px 0 var(--shadow)}
.ph .boardwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.ph .colnums,.ph .rownums,.ph .boardwrap>span:first-child{display:none}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;border:2.5px solid var(--ink);background:var(--card);border-radius:999px;padding:2px;min-width:48px;min-height:48px;display:grid;place-items:center;position:relative}
.strip button .hd{width:40px;height:40px}
.strip button[aria-pressed="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--shadow)}
.strip button.done::after{content:"✓";position:absolute;right:-4px;bottom:-4px;background:var(--ok);color:var(--card);border-radius:50%;width:18px;height:18px;font:700 11px/18px var(--body);text-align:center}
.strip .xb{font:700 1.1rem var(--hand);padding:0 14px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 4px 10px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .card{flex:0 0 86%;scroll-snap-align:center;transform:none!important}
.dots{display:flex;justify-content:center;gap:5px;margin-top:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--ink);width:18px;border-radius:4px}
.ph .actions .btn{flex:1;min-height:48px}
/* Rejtő a Quadretti — 1930s pulp/hotel theme. */
:root{
  --paper:#E9DCC3; --card:#F7EEDC; --ink:#2B2118; --muted:#6B5B4A; --grid:rgba(90,60,30,.13);
  --blue:#2F4858; --pink:#A64B5A; --yellow:#D9A441; --red:#A33127; --ok:#4F6B3A; --hu:#7A3E2F;
  --on-yellow:#2B2118; --wall:#2B2118; --tape:rgba(163,49,39,.45); --shadow:#2B2118;
  --r0:#E8D3A8; --r1:#D9B6A6; --r2:#B9C7C2; --r3:#C9D3B0; --r4:#E0C3A0; --r5:#C7B9D0; --r6:#D6C39A;
  --display:"Bevan","Impact",serif;
  --body:"Bitter",Georgia,serif;
  --type:"Special Elite","Courier Prime",monospace;
  --hand:"Caveat",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1E1712; --card:#2A2119; --ink:#F0E2C8; --muted:#BFAE95; --grid:rgba(230,200,150,.08);
  --blue:#8FA9B8; --pink:#C77A86; --yellow:#D9A441; --red:#C25B4A; --ok:#8DB07A; --hu:#D39B7A;
  --on-yellow:#1E1712; --wall:#F0E2C8; --tape:rgba(194,91,74,.45); --shadow:#000000;
  --r0:#4A3A24; --r1:#4C2E2C; --r2:#2C3C3A; --r3:#36412F; --r4:#4A3524; --r5:#3B3047; --r6:#443722; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1E1712; --card:#2A2119; --ink:#F0E2C8; --muted:#BFAE95; --grid:rgba(230,200,150,.08);
  --blue:#8FA9B8; --pink:#C77A86; --yellow:#D9A441; --red:#C25B4A; --ok:#8DB07A; --hu:#D39B7A;
  --on-yellow:#1E1712; --wall:#F0E2C8; --tape:rgba(194,91,74,.45); --shadow:#000000;
  --r0:#4A3A24; --r1:#4C2E2C; --r2:#2C3C3A; --r3:#36412F; --r4:#4A3524; --r5:#3B3047; --r6:#443722; color-scheme:dark }
html,body{background:var(--paper);color:var(--ink)}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(circle at 18% 10%,rgba(163,49,39,.06),transparent 58%);background-size:24px 24px,24px 24px,100% 100%}
.brand h1{letter-spacing:.01em;text-transform:none}
.brand small{letter-spacing:.12em}
.mark{background:var(--yellow);border-radius:6px;box-shadow:3px 3px 0 var(--red);transform:rotate(-3deg)}
.mark i.v{background:var(--red)}
.hero h2{letter-spacing:.005em}
.hero h2 .hl{background:var(--red);color:var(--card);box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.5deg)}
.hero .actions .btn{background:var(--yellow)}
.btn{border-radius:5px;border-width:3px;box-shadow:4px 4px 0 var(--shadow)}
.btn.ghost{background:var(--card)}
.pill{border-radius:5px;border-width:2.5px}
.pill[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--card)}
.say{color:var(--red)}
.case{border-radius:5px;border-width:3px;box-shadow:5px 5px 0 var(--shadow)}
.case .tape{background:repeating-linear-gradient(-45deg,var(--tape) 0 6px,transparent 6px 10px),var(--tape)}
.case .flav{font-style:italic}
.card{border-radius:5px;border-width:2.5px;box-shadow:3px 3px 0 var(--shadow)}
.clip{border-radius:8px;border-width:3px;box-shadow:6px 6px 0 var(--shadow)}
.board{border-radius:2px;border-width:4px}
.cell .lab{background:var(--card);border-width:2px;transform:rotate(-2deg)}
.legend .chip{border-radius:4px}
.slip{border-radius:5px;box-shadow:4px 4px 0 var(--shadow)}
.msg{border-radius:5px}
.modal .box{border-radius:8px;box-shadow:8px 8px 0 var(--red)}
.modal .stp{opacity:.95}
.reviewchip{border-radius:5px}
.revperson{border-radius:5px}
.rule,.objbox{border-radius:5px}
.coderow .bigcode{background:var(--yellow);box-shadow:5px 5px 0 var(--red)}
.casehead{border-bottom:2px solid var(--ink);padding-bottom:10px}
.timer{border-radius:4px;box-shadow:3px 3px 0 var(--red)}
.tip .tb{border-radius:14px 14px 14px 3px}
.tip .tb .say-it{font-family:var(--hand);font-size:1.25rem}
footer{font-family:var(--type);font-size:.78rem;letter-spacing:.04em}

<script>const A = window.GQArt;

function clueStr(cs,cl,lang){
  lang=lang||LANG; const N=cs.size, g=cs.people[cl.p][1], who=i=>cs.people[i][0], a={};
  if(cl.t==='room'||cl.t==='notroom') a.inr=ROOMS[cs.rooms[cl.v].it][lang][1];

}

function huStr(cs,cl){
  const N=cs.size, R=cs.rooms, name=i=>cs.people[i][0];
  const ord=v=> v===N-1 ? 'az ⟦utolsó' : huArt(ORD_HU[v])+' ⟦'+ORD_HU[v];

/* ---------- network (co-op) ---------- */
function makeNet(){
  let q=null; try{ q=new URLSearchParams(location.search).get('net'); }catch(e){}
  if(q==='local' && 'BroadcastChannel' in window) return localNet();
  const cfg=window.GQ_CONFIG||{};
  if(cfg.supabaseUrl && cfg.supabaseKey && window.supabase && window.supabase.createClient) return supaNet(cfg);
  return null;
}
function supaNet(cfg){
  const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{realtime:{params:{eventsPerSecond:20}}});
  return { join(code,me,h){
    const ch=client.channel(roomChannel(code),{config:{broadcast:{self:false},presence:{key:me.id}}});
    ch.on('broadcast',{event:'m'},({payload})=>h.onMsg(payload));
    ch.on('presence',{event:'sync'},()=>{ const st=ch.presenceState(), list=[]; for(const k in st){ const m=st[k]&&st[k][0]; if(m&&m.id) list.push({id:m.id,name:m.name,lang:m.lang,joined:m.joined}); } h.onPeers(list); });
    ch.subscribe(async status=>{ if(status==='SUBSCRIBED'){ try{ await ch.track(me); }catch(e){} h.onReady(); } else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') h.onError(status); });
    return { send:m=>{ try{ ch.send({type:'broadcast',event:'m',payload:m}); }catch(e){} }, update:me2=>{ try{ ch.track(me2); }catch(e){} }, leave:()=>{ try{ ch.untrack(); client.removeChannel(ch); }catch(e){} } };
  } };
}
function localNet(){
  return { join(code,me,h){
    const bc=new BroadcastChannel(roomChannel(code)); let self=me; const seen={};
    const peers=()=>{ const now=Date.now(); const l=[self]; for(const id in seen){ if(now-seen[id].t<4000) l.push(seen[id].m); } h.onPeers(l); };
    bc.onmessage=e=>{ const m=e.data; if(m&&m.__pres){ const known=!!seen[m.me.id]; seen[m.me.id]={m:m.me,t:Date.now()}; if(!known) peers(); return; } if(m&&m.__bye){ delete seen[m.id]; peers(); return; } h.onMsg(m); };
    const beat=()=>bc.postMessage({__pres:1,me:self});
    const iv=setInterval(()=>{ beat(); peers(); },1000);
    setTimeout(()=>{ beat(); peers(); h.onReady(); },50);
    return { send:m=>bc.postMessage(m), update:m2=>{ self=m2; beat(); peers(); }, leave:()=>{ clearInterval(iv); bc.postMessage({__bye:1,id:self.id}); bc.close(); } };
  } };
}
const NET=makeNet();

function saveProg(){ if(S.coop||!S.cs||S.phase==='done') return; store.set('prog:'+S.cs.id,{place:S.place,marks:[...S.marks],hints:S.hints,elapsed:curElapsed()}); }
function curElapsed(){ if(S.coop){ const st=S.coop.st; return st.t0? Math.floor(((st.phase==='done'&&st.tEnd)?st.tEnd:Date.now())-st.t0)/1000|0 : 0; }
  return S.elapsed + (S.phase==='done'?0:Math.floor((Date.now()-S.t0)/1000)); }
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

/* ---------- co-op ---------- */
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ';
function newCode(){ let s=''; for(let i=0;i<4;i++) s+=CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]; return s; }
function myId(){ let id=globalStore.get('pid',null); if(!id){ id='p'+Math.random().toString(36).slice(2,10); globalStore.set('pid',id); } return id; }
function emptySt(){ return {v:0,by:'',caseId:null,place:{},marks:[],shared:[],owners:[],phase:'lobby',t0:0,tEnd:0,hints:0,lam:0,pc:{},mc:{}}; }
function joinRoom(code,name){
  if(!NET) return;
  code=code.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4); if(code.length!==4) return;
  name=(name||'').trim().slice(0,16)||'Detective'; globalStore.set('name',name);
  const me={id:myId()+'-'+Math.random().toString(36).slice(2,5),name,lang:LANG,joined:Date.now()};
  S.coop={code,me,peers:[me],st:emptySt(),ready:false,link:null};
  S.view='lobby'; render();
  S.coop.link=NET.join(code,me,{
    onReady(){ if(!S.coop) return; S.coop.ready=true; S.coop.link.send({t:'hello',from:me.id}); render(); },
    onError(){ if(!S.coop) return; S.coop.error=true; render(); },
    onPeers(list){ if(!S.coop) return; const seen={}; const ps=list.filter(p=>p&&p.id&&!seen[p.id]&&(seen[p.id]=1)).sort((a,b)=>(a.joined-b.joined)||(a.id<b.id?-1:1));
      const sig=ps.map(p=>p.id+'|'+p.name+'|'+p.lang).join(','); if(sig===S.coop.sig) return; S.coop.sig=sig; S.coop.peers=ps; render();
      if(isHost()) setTimeout(ensureOwners,0); },
    onMsg(m){ if(!S.coop||!m) return;
      if(m.t==='hello'){ if(S.coop.st.v>0) S.coop.link.send({t:'state',st:S.coop.st}); }
      else if(m.t==='state') mergeSt(m.st);

    }
  });

// Keep every suspect's clue with a present player, even after somebody joins or leaves.
function ensureOwners(){
  const c=S.coop; if(!c||!isHost()||!c.st.caseId||!S.cs) return;
  const ps=players(); if(!ps.length) return;
  const P=S.cs.people.length-1;

  while(owners.length<P) owners.push(null);
  const ids=new Set(ps.map(p=>p.id));
  let changed=false;
  const count=()=>{ const m={}; for(const o of owners) if(o) m[o]=(m[o]||0)+1; return m; };
  for(let i=0;i<P;i++) if(!owners[i]||!ids.has(owners[i])){ owners[i]=null; changed=true; }

    for(let i=0;i<P;i++) if(owners[i]===d.id&&!c.st.shared.includes(i)){ idx=i; break; }
    if(idx<0) for(let i=P-1;i>=0;i--) if(owners[i]===d.id){ idx=i; break; }

      h('h3',{},caseTitle(cs)), h('span',{class:'flav'},caseFlav(cs)),

/* ---------- lobby ---------- */
function playerChip(p,k){ const me=S.coop&&p.id===S.coop.me.id;

function renderLobby(app){

      h('p',{class:'typ',style:'margin:12px 0 0'},T('roomStyle')+': '+((STYLES.find(s=>s.id===PACK.id)||{}).name||PACK.name))),
    h('div',{},h('h2',{style:'font-size:1.5rem;margin-bottom:10px'},T('team')),h('div',{class:'players'},...ps.map(playerChip)),
      !c.ready?h('p',{class:'typ'},c.error?T('offline'):T('connecting')):ps.length<2?h('p',{style:'color:var(--muted)'},T('alone')):null),

}

/* ---------- case ---------- */
function roomIndex(cs){ const keys=Object.keys(cs.rooms); return k=>keys.indexOf(k); }
function suspectCard(cs,i,opts){
  const P=cs.people.length, victim=P-1, isV=i===victim, nm=cs.people[i][0];
  const byP=cs.clues.filter(c=>c.p===i);
  const see=canSee(i), holder=S.coop&&!isV?holderOf(i):null, mine=holder&&holder.id===S.coop.me.id, shared=S.coop&&S.coop.st.shared.includes(i);
  const open=S.huAll||S.openHu.has(i);
  const lines=isV?[{it:victimStr(cs),hu:'Az áldozat. Egyedül volt a gyilkossal.'}]:byP.map(c=>({it:clueStr(cs,c),hu:huStr(cs,c)}));
  const card=h('div',{class:'card'+(isV?' victim':'')+(see?'':' locked')+(S.tool===i&&S.phase==='play'?' sel':''),style:opts&&opts.flat?'':`transform:rotate(${[-.8,.6,-.4,.9,-.6,.4,-.9][i%7]}deg)`,'data-i':String(i)},
    isV?h('span',{class:'vtag'},T('victim')):null,
    sticker(cs,i),
    h('div',{class:'nm'},h('b',{},nm),see&&!S.huAll?h('button',{class:'hubtn','aria-pressed':String(open),'aria-label':'HU',onclick:e=>{e.stopPropagation();open?S.openHu.delete(i):S.openHu.add(i);render()}},'HU'):null));
  if(see){
    lines.forEach(l=>card.append(h('div',{},h('p',{class:'clue'},marked(l.it),sayBtn(nm+'. '+l.it,nm)),open?h('p',{class:'hu'},marked(l.hu)):null)));
    if(S.coop&&!isV){ if(mine&&!shared) card.append(h('button',{class:'sharebtn',onclick:e=>{e.stopPropagation();shareClue(i)}},T('share')));
      else if(mine) card.append(h('span',{class:'mine'},'✓ '+T('yours')));
      else if(shared) card.append(h('span',{class:'sharedtag'},fill(T('sharedBy'),{n:holder?holder.name:'?'}))); }
  } else card.append(h('p',{class:'clue'},svgEl(LOCK,'lockic'),h('span',{},fill(T('heldBy'),{n:holder?holder.name:'?'}))));
  if(S.place[i]) card.append(h('span',{class:'placed'},`✓ R${S.place[i][0]+1} · C${S.place[i][1]+1}`));
  return card;
}
function glossary(cs){
  const ri=roomIndex(cs), words=[]; const objsHere=[...new Set(Object.values(cs.objs))], G=T('gl');
  Object.entries(cs.rooms).forEach(([k,r])=>words.push({w:roomName(cs,k),hu:r.hu,ic:h('span',{class:'sw',style:`width:26px;height:26px;background:var(--r${ri(k)})`})}));
  objsHere.forEach(k=>words.push({w:plain(OBJL[LANG][k][0]),hu:OBJ[k].hu+(OBJ[k].occ?' · ✓':' · ✕'),ic:svgEl(A.object(k),'ic')}));
  const kw=new Set(cs.clues.map(c=>c.t));
  [['row','sor','row'],['col','oszlop','col'],['by','mellett','by'],['alone','egyedül','alone'],['only','az egyetlen','onlyon'],['with','ugyanaz a szoba','with'],['dir','É · D · K · Ny','dir'],['corner','sarok','corner'],['not','nem volt','notroom']]
    .filter(e=>kw.has(e[2])).forEach(([k,hu])=>words.push({w:G[k],hu}));
  words.push({w:G.victim,hu:'az áldozat'},{w:G.killer,hu:'a gyilkos'});
  return h('div',{class:'gloss'},...words.map(w=>h('div',{class:'gw'},w.ic||null,h('div',{},h('b',{},w.w),h('p',{class:'hu'},w.hu)),sayBtn(w.w,w.w))));
}
let lpTimer=null, lpFired=false;
function boardEl(cs){
  const N=cs.size, ri=roomIndex(cs), bad=conflicts();
  const board=h('div',{class:'board',style:`grid-template-columns:repeat(${N},1fr);grid-template-rows:repeat(${N},1fr)`});
  const lab={}; for(let r=N-1;r>=0;r--)for(let c=0;c<N;c++){const k=cs.grid[r][c]; if(!lab[k]) lab[k]=r+','+c;}
  const W='4px solid var(--wall)';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const k=cs.grid[r][c], key=r+','+c, o=cs.objs[key];
    const st=[`background:var(--r${ri(k)})`];
    if(r>0&&cs.grid[r-1][c]!==k) st.push('border-top:'+W);
    if(c>0&&cs.grid[r][c-1]!==k) st.push('border-left:'+W);
    const occ=Object.keys(S.place).find(i=>S.place[i][0]===r&&S.place[i][1]===c);
    const blocked=o&&!OBJ[o].occ, wt=r===0||cs.grid[r-1][c]!==k, wl=c===0||cs.grid[r][c-1]!==k;
    const desc=`R${r+1} C${c+1}, ${roomName(cs,k)}`+(o?`, ${plain(OBJL[LANG][o][0])}`:'')+(occ!=null?`, ${cs.people[occ][0]}`:'')+(S.marks.has(key)?', ✕':'');
    const focused=S.focus&&S.focus[0]===r&&S.focus[1]===c, tabb=focused?0:(S.focus?-1:(r===0&&c===0?0:-1));
    const cell=h('button',{class:'cell'+(wt?' wt':'')+(wl?' wl':'')+(blocked?' blk':'')+(occ!=null&&bad.has(String(occ))?' bad':''),style:st.join(';'),'aria-label':desc,
      'data-r':r,'data-c':c,tabindex:tabb,
      onfocus:()=>{ S.focus=[r,c]; },
      onkeydown:e=>{
        const K=e.key;
        const dr=K==='ArrowUp'?-1:K==='ArrowDown'?1:0, dc=K==='ArrowLeft'?-1:K==='ArrowRight'?1:0;
        if(dr||dc){ e.preventDefault(); const rr=r+dr, cc=c+dc;
          if(rr>=0&&rr<N&&cc>=0&&cc<N){ S.focus=[rr,cc]; const next=document.querySelector(`.cell[data-r="${rr}"][data-c="${cc}"]`); if(next){ cell.parentElement.querySelectorAll('.cell').forEach(el=>el.tabIndex=-1); next.tabIndex=0; next.focus(); } }
        } else if(K==='Delete'||K==='Backspace'){ e.preventDefault(); S.focus=[r,c]; onCell(r,c,true); }
      },
      onpointerdown:()=>{ S.focus=[r,c]; lpFired=false; clearTimeout(lpTimer); lpTimer=setTimeout(()=>{ lpFired=true; try{navigator.vibrate&&navigator.vibrate(15)}catch(e){} onCell(r,c,true); },450); },
      onpointerup:()=>clearTimeout(lpTimer), onpointerleave:()=>clearTimeout(lpTimer), oncontextmenu:e=>e.preventDefault(),
      onclick:()=>{ S.focus=[r,c]; if(lpFired){ lpFired=false; return; } onCell(r,c,false); }});
    if(o) cell.append(svgEl(A.object(o),'ob'));
    if(occ!=null) cell.append(svgEl(A.portrait(lookOf(cs.people[occ][0],+occ),{crop:'head',bg:BGS[occ%BGS.length]}),'pc'));
    else if(S.marks.has(key)) cell.append(h('span',{class:'xm'},'✕'));
    if(lab[k]===key) cell.append(h('span',{class:'lab'},roomName(cs,k)));
    board.append(cell);
  }
  const colnums=h('div',{class:'colnums',style:`grid-template-columns:repeat(${N},1fr)`},...Array.from({length:N},(_,i)=>h('span',{},'C'+(i+1))));
  const rownums=h('div',{class:'rownums',style:`grid-template-rows:repeat(${N},1fr)`},...Array.from({length:N},(_,i)=>h('span',{},'R'+(i+1))));
  return h('div',{class:'boardwrap'},h('span',{}),colnums,rownums,board);
}
function legend(cs){ const ri=roomIndex(cs); return h('div',{class:'legend'},...Object.keys(cs.rooms).map(k=>h('span',{class:'chip'},h('span',{class:'sw',style:`background:var(--r${ri(k)})`}),roomName(cs,k),sayBtn(roomName(cs,k),'')))); }
function phaseBlock(cs){
  const wrap=h('div');
  if(S.phase==='play'){
    wrap.append(h('div',{class:'actions'},h('button',{class:'btn',onclick:check},T('check')),
      S.coop?null:h('button',{class:'btn ghost small',onclick:undo,disabled:!S.hist.length},T('undo')),
      h('button',{class:'btn ghost small',onclick:hint},T('help')),h('button',{class:'btn ghost small',onclick:resetCase},T('restart'))));
  } else if(S.phase==='accuse'){
    wrap.append(h('div',{class:'slip'},h('p',{class:'typ',style:'margin:0;color:var(--ok)'},'✓ '+T('allRight')),
      h('h3',{},T('killerIs'),' ',sayBtn(T('killerIs'),'')),h('div',{class:'line'}),S.huAll?h('p',{class:'hu',style:'margin-bottom:8px'},'Ki a gyilkos?'):null,
      h('div',{class:'pick'},...cs.people.slice(0,-1).map(([nm],i)=>h('button',{class:'tool',onclick:()=>accuse(i)},head(cs,i),nm)))));
  } else {
    wrap.append(h('div',{class:'slip'},h('h3',{},fill(T('solved'),{n:cs.people[cs.killer][0]})),
      h('div',{class:'actions'},(!S.coop||isHost())?h('button',{class:'btn',onclick:nextCase},T('next')):null,(!S.coop||isHost())?h('button',{class:'btn ghost small',onclick:resetCase},T('again')):null)));
  }
  if(S.msg) wrap.append(h('div',{class:'msg '+(S.msg.kind||''),role:'status'},h('p',{},marked(S.msg.it),' ',sayBtn(S.msg.it,'')),S.huAll?h('p',{class:'hu'},S.msg.hu):null));
  return wrap;
}
function teamBar(){ if(!S.coop) return null; return h('div',{class:'teambar'},h('span',{class:'typ'},T('room')+' '+S.coop.code),...players().map(playerChip)); }
function caseHead(cs){
  return h('div',{class:'casehead'},
    h('div',{style:'min-width:0'},
      h('span',{class:'typ'},`${T('caso')} ${String(S.idx+1).padStart(2,'0')} · ${T('levels')[cs.level]} · ${cs.size}×${cs.size}`),
      h('h2',{},caseTitle(cs),' ',sayBtn(caseTitle(cs),'')),
      h('p',{class:'flav'},caseFlav(cs),' ',sayBtn(caseFlav(cs),'')),
      S.huAll&&!cs.titleHu?h('p',{class:'hu'},cs.flavHu):null),
    h('div',{class:'timer',id:'timer'},fmt(curElapsed())));
}
function tipBox(){ const k=S.tip%5, tp=T('tips')[k];
  return h('div',{class:'tip'},svgEl(A.pigeon(),'pg'),h('div',{class:'tb'},h('p',{class:'say-it'},tp,' ',sayBtn(tp,'')),S.huAll?h('p',{class:'hu'},HU_TIPS[k]):null,h('button',{class:'more',onclick:()=>{S.tip++;render()}},T('more')))); }

function renderCase(app){
  const cs=S.cs;
  app.append(topbar());
  app.append(h('button',{class:'back',onclick:goHub},'← '+(S.coop?T('leave'):T('back'))));
  app.append(caseHead(cs));
  if(S.coop) app.append(teamBar());
  if(PH) return renderCasePhone(app,cs);
  app.append(tipBox());
  const cards=h('div',{class:'cards'}); cs.people.forEach((_,i)=>cards.append(suspectCard(cs,i)));
  const left=h('div',{style:'min-width:0'},h('div',{class:'section-h',style:'margin-top:4px'},h('h2',{},T('suspects'))),cards,
    h('div',{class:'section-h'},h('h2',{},T('words')),h('span',{class:'hu'},'szószedet')),glossary(cs));
  const clip=h('div',{class:'clip'});
  if(S.phase==='play'){
    const tools=h('div',{class:'tools',role:'toolbar'});
    tools.append(h('button',{class:'tool xmark','aria-pressed':String(S.tool==='x'),onclick:()=>{S.tool='x';render()}},T('mark')));
    cs.people.forEach(([nm],i)=>tools.append(h('button',{class:'tool'+(S.place[i]?' done':''),'aria-pressed':String(S.tool===i),onclick:()=>{S.tool=i;render()}},head(cs,i),shortName(nm))));
    clip.append(tools);
    clip.append(h('p',{class:'toolhint'}, S.tool==='x'?T('hintX'):fill(T('hintPlace'),{n:cs.people[S.tool][0]})+' '+T('longpress')));
    clip.append(h('p',{class:'toolhint kbd'},T('keys')));
  }
  clip.append(boardEl(cs), legend(cs), phaseBlock(cs));
  app.append(h('div',{class:'layout'},left,h('div',{class:'boardcol'},clip)));
}
let carouselLock=false;
function renderCasePhone(app,cs){
  app.classList.add('ph');
  const clip=h('div',{class:'clip'}); clip.append(boardEl(cs)); app.append(clip);
  if(S.phase==='play'){
    const strip=h('div',{class:'strip',role:'toolbar'});
    strip.append(h('button',{class:'xb','aria-pressed':String(S.tool==='x'),'aria-label':T('mark'),onclick:()=>{S.tool='x';render()}},'✕'));
    cs.people.forEach(([nm],i)=>strip.append(h('button',{class:S.place[i]?'done':'','aria-pressed':String(S.tool===i),'aria-label':nm,onclick:()=>{S.tool=i;render()}},head(cs,i))));
    app.append(strip);
    app.append(h('p',{class:'toolhint',style:'margin:0 2px'}, S.tool==='x'?T('hintX'):fill(T('hintPlace'),{n:cs.people[S.tool][0]})+' '+T('longpress')));
  }
  const car=h('div',{class:'carousel'}); cs.people.forEach((_,i)=>car.append(suspectCard(cs,i,{flat:1})));
  app.append(car);
  const sel=S.tool==='x'?0:S.tool;
  app.append(h('div',{class:'dots','aria-hidden':'true'},...cs.people.map((_,i)=>h('i',{class:i===sel?'on':''}))));
  requestAnimationFrame(()=>{ const el=car.children[sel]; if(el){ carouselLock=true; car.scrollLeft=el.offsetLeft-(car.clientWidth-el.clientWidth)/2; setTimeout(()=>{carouselLock=false},120); } });
  let st=null;
  car.addEventListener('scroll',()=>{ if(carouselLock) return; clearTimeout(st); st=setTimeout(()=>{
    const mid=car.scrollLeft+car.clientWidth/2; let best=0,bd=1e9;
    [...car.children].forEach((c,i)=>{ const d=Math.abs(c.offsetLeft+c.clientWidth/2-mid); if(d<bd){bd=d;best=i;} });
    if(S.phase==='play'&&S.tool!==best){ S.tool=best; render(); }
  },140); },{passive:true});
  app.append(phaseBlock(cs));
  app.append(h('details',{class:'drawer'},h('summary',{},T('tip')),h('div',{class:'inner'},tipBox())));
  app.append(h('details',{class:'drawer'},h('summary',{},T('words')),h('div',{class:'inner'},glossary(cs))));
  app.append(h('details',{class:'drawer'},h('summary',{},T('rooms')),h('div',{class:'inner'},legend(cs))));
}
function showWin(time){
  const cs=S.cs, k=cs.people[cs.killer][0];
  const old=document.querySelector('.modal'); if(old) old.remove();
  const m=h('div',{class:'modal',role:'dialog','aria-modal':'true'},
    h('div',{class:'box'},
      svgEl(A.portrait(lookOf(k,cs.killer),{bg:'red',label:k}),'who'),
      svgEl(A.stamp(PACK.stampText||'COLPEVOLE','red'),'stp'),
      h('h3',{},fill(T('solved'),{n:k})),
      h('p',{class:'typ'},`${T('time')} ${fmt(time)}`+(S.hints?` · ${T('hints')} ${S.hints}`:'')),
      S.huAll?h('p',{class:'hu'},`A gyilkos: ${k}!`):null,
      h('div',{class:'actions',style:'justify-content:center'},
        (!S.coop||isHost())?h('button',{class:'btn',onclick:()=>{m.remove();nextCase()}},T('next')):null,
        h('button',{class:'btn ghost',onclick:()=>{m.remove();showReview(cs)}},'📖 '+T('review')),
        h('button',{class:'btn ghost',onclick:()=>{m.remove();if(!S.coop)goHub();}},S.coop?'OK':T('back')))));
  m.addEventListener('click',e=>{ if(e.target===m) m.remove(); });

/* ---------- case review (language notebook) ---------- */
function reviewPerson(cs,i){
  const nm=cs.people[i][0], isV=i===cs.people.length-1;
  const byP=cs.clues.filter(c=>c.p===i);
  const lines=isV?[{it:victimStr(cs),hu:'Az áldozat. Egyedül volt a gyilkossal.'}]:byP.map(c=>({it:clueStr(cs,c),hu:huStr(cs,c)}));
  return h('div',{class:'revperson'+(isV?' victim':'')},
    head(cs,i),
    h('div',{class:'revbody'},h('b',{},nm),
      ...lines.map(l=>h('div',{class:'revclue'},
        h('p',{class:'clue'},marked(l.it),sayBtn(nm+'. '+l.it,nm)),
        S.huAll?h('p',{class:'hu'},marked(l.hu)):null))));
}
function showReview(cs){
  const old=document.querySelector('.modal'); if(old) old.remove();
  if(!cs) return;
  const sv=S.solved[cs.id], k=cs.people[cs.killer][0];
  const box=h('div',{class:'box reviewbox'},
    h('button',{class:'xclose',onclick:()=>m.remove(),'aria-label':T('close')},'✕'),
    h('div',{class:'revhead'},
      h('div',{},
        h('span',{class:'typ'},`${T('caso')} ${String(CASES.indexOf(cs)+1).padStart(2,'0')} · ${cs.size}×${cs.size}`),
        h('h3',{},caseTitle(cs))),
      h('button',{class:'pill hu-toggle','aria-pressed':String(S.huAll),onclick:()=>{S.huAll=!S.huAll;store.set('huAll',S.huAll);showReview(cs)}},'HU ',S.huAll?'✓':'–')),
    h('p',{class:'revsolved'},fill(T('solved'),{n:k})+(sv?` · ${T('time')} ${fmt(sv.time)}`:'')),
    h('p',{class:'reviewlead'},T('reviewLead')),
    h('h4',{},T('cluesReview')),
    h('div',{class:'revlist'},...cs.people.map((_,i)=>reviewPerson(cs,i))),
    h('h4',{},T('words')),
    glossary(cs),
    h('div',{class:'actions',style:'justify-content:flex-end'},h('button',{class:'btn',onclick:()=>m.remove()},T('close'))));
  const m=h('div',{class:'modal review',role:'dialog','aria-modal':'true'},box);
  m.addEventListener('click',e=>{ if(e.target===m) m.remove(); });
  m.tabIndex=-1;
  m.addEventListener('keydown',e=>{ if(e.key==='Escape') m.remove(); });
  document.body.append(m);
  box.scrollTop=0;
  m.focus();
}

function render(){ const app=document.getElementById('app'); app.innerHTML=''; app.classList.remove('ph'); document.documentElement.lang=LANG;
  if(S.view==='lobby'&&S.coop) renderLobby(app); else if(S.view==='case'&&S.cs) renderCase(app); else renderHub(app);
  if(S.view==='case'&&S.cs&&S.focus&&S.phase==='play'&&!document.querySelector('.modal')){
    const el=document.querySelector(`.cell[data-r="${S.focus[0]}"][data-c="${S.focus[1]}"]`);
    if(el&&document.activeElement!==el) el.focus({preventScroll:true});
  }
}
function boot(){ let id=''; try{id=(location.hash||'').slice(1)}catch(e){} const i=CASES.findIndex(c=>c.id===id); if(i>=0) startCase(i); else render(); }
window.addEventListener('hashchange',()=>{ if(S.coop) return; let id='';try{id=location.hash.slice(1)}catch(e){} const i=CASES.findIndex(c=>c.id===id); if(i>=0&&(!S.cs||S.cs.id!==id)) startCase(i); else if(i<0&&S.view!=='hub'&&!/^r-/.test(id)) goHub();});
window.addEventListener('pagehide',()=>{ saveProg(); if(S.coop) leaveRoom(); });
boot();
/* A host chose another style for a new room: create it here, then clean the query. */
(function(){
  let q=null; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  if(q.get('create')==='1' && NET && !S.coop){
    const name=(q.get('name')||globalStore.get('name','')||'').trim().slice(0,16);
    joinRoom(newCode(),name);
    try{ if(S.coop) history.replaceState(null,'',location.pathname+(NET_PARAM?'?net='+encodeURIComponent(NET_PARAM):'')+'#r-'+S.coop.code); }catch(e){}
  }
})();
